# AGPOA with retriever-embedding surrogate
name: agpoa_querydrift
type: adversarial
description: "AGPOA using a retriever-embedding surrogate and embedding drift loss"
momentum_factor: 0.6
budget_alpha: 1.0
num_gradient_modifications: 1000
top_k: 50
trials: 5

embedding_loss_type: cosine
surrogate_hidden: 256
surrogate_epochs: 200
surrogate_lr: 0.01
surrogate_weight_decay: 0.0005
surrogate_dropout: 0.0
surrogate_loss_type: cosine
surrogate_patience: 30
