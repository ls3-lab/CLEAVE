# CLEAVE - Contrastive-Learned Edge Attack Via Embeddings (query-free black-box, no victim access)
name: cleave
type: learned
# AGPOA gradient-attack hyperparameters
momentum_factor: 0.6
num_gradient_modifications: 1000
top_k: 50
embedding_loss_type: cosine
# self-supervised GRACE surrogate (trained from scratch on structure+features only)
surrogate_hidden: 256
surrogate_out: 256
surrogate_epochs: 300
surrogate_lr: 0.001
drop1: 0.3
drop2: 0.4
fmask1: 0.2
fmask2: 0.3
tau: 0.5
cl_batch: 2048
n_surrogates: 1
# degree-aware Module-1 selection: 0.0 = plain CLEAVE; >0 biases toward high-degree neighbours
# (fixes the dense/degree cells where the GCN's degree-norm suppresses hub-edge gradients).
degree_bias: 0.0
# demotion target: query (neighbourhood centroid in surrogate space) | self (target's own clean emb)
drift_reference: query
# importance signal for the bias reweight: degree | thp
bias_signal: degree
# per-target choose biased-vs-plain set by surrogate drift (needs degree_bias>0)
degree_adaptive: false
# RA-IF: rank-aligned competitor-margin single-edge score at budget 1
b1_margin: false
b1_kcomp: 50
# single-edge selector at budget 1: raif | drift | effres | off
b1_signal: "off"
b1_lam: 1.0
# S4 ablation: random fraction of undirected edges given to CLEAVE (1.0 = full graph)
graph_fraction: 1.0
# Leakage check: train SSL surrogate on an 80/20 node split's TRAIN subgraph only (test targets +
# fill removed from surrogate training). 0.0 = standard full-graph (transductive) CLEAVE.
surrogate_holdout: 0.0
# Selection phase: also exclude the TRAIN (validation) targets from the surrogate, so picking
# hyperparameters by demotion on the train targets is unbiased. false for the final TEST eval.
surrogate_exclude_train: false
# Attack-only frozen-query radius override (decouples q_t from the EVALUATOR's query_radius).
# Empty "" = use the dataset's canonical radius. Values: 1hop | 2hop | blend.
query_radius: ""
