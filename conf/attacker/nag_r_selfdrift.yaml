# NAG-R, retriever-embedding surrogate — SELF-DRIFT (query-free) ablation of Tier-1 nag_r.
# Drifts the target from its OWN clean embedding instead of the centroid query.
name: nag_r_selfdrift
type: adversarial
description: "NAG-R self-drift: surrogate embedding drift from the target's own clean embedding (no query)"
decay: 0.9
step: 0.7
trials: 5

drift_reference: self
embedding_loss_type: cosine
surrogate_hidden: 256
surrogate_epochs: 200
surrogate_lr: 0.01
surrogate_weight_decay: 0.0005
surrogate_dropout: 0.0
surrogate_loss_type: cosine
surrogate_patience: 30
