# Nettack-inspired greedy attack with retriever-embedding surrogate
name: nettack_querydrift
type: adversarial
description: "Nettack-style greedy edge removal using a retriever-embedding surrogate"
trials: 5

embedding_loss_type: cosine
greedy_recompute: true
surrogate_hidden: 256
surrogate_epochs: 200
surrogate_lr: 0.01
surrogate_weight_decay: 0.0005
surrogate_dropout: 0.0
surrogate_loss_type: cosine
surrogate_patience: 30
