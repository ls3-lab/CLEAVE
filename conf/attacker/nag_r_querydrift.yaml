# NAG-R with retriever-embedding surrogate
name: nag_r_querydrift
type: adversarial
description: "NAG-R using a retriever-embedding surrogate and embedding drift loss"
decay: 0.9
step: 0.7
trials: 5

embedding_loss_type: cosine
surrogate_hidden: 256
surrogate_epochs: 200
surrogate_lr: 0.01
surrogate_weight_decay: 0.0005
surrogate_dropout: 0.0
surrogate_loss_type: cosine
surrogate_patience: 30
