# New surrogate-free / rank-aware add-edge methods. add_edge mode.
defaults:
  - dataset: cora
  - retriever: grace
  - attacker@attackers.1: amsp
  - attacker@attackers.2: anticentroid
  - attacker@attackers.3: ranktransfer
  - _self_
general:
  seed: 42
  device: cuda
  budget: 5
  graph_model: gcn
  add_edge: true
  output_dir: ${hydra:runtime.cwd}/output_addedge
  cache_dir: ${hydra:runtime.cwd}/cache
hydra:
  run:
    dir: ${general.output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
