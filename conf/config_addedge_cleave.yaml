# CLEAVE in add-edge mode. Reuses the cleave attacker config; sets add_edge.
# Results append to the same results_add_<dataset>_<retriever>_<budget>.csv set.
defaults:
  - dataset: cora
  - retriever: grace
  - attacker@attackers.1: cleave
  - _self_
general:
  seed: 42
  device: cuda
  budget: 5
  graph_model: gcn
  add_edge: true
  output_dir: ${hydra:runtime.cwd}/output_addedge
  cache_dir: ${hydra:runtime.cwd}/cache
hydra:
  run:
    dir: ${general.output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
