# batch: curvaturebridge, eigshift, submod_demote, facloc_disperse, shapedge
defaults:
  - dataset: cora
  - retriever: grace
  - attacker@attackers.1: curvaturebridge
  - attacker@attackers.2: eigshift
  - attacker@attackers.3: submod_demote
  - attacker@attackers.4: facloc_disperse
  - attacker@attackers.5: shapedge
  - _self_
general:
  seed: 42
  device: cuda
  budget: 5
  graph_model: gcn
  add_edge: true
  output_dir: ${hydra:runtime.cwd}/output_addedge
  cache_dir: ${hydra:runtime.cwd}/cache
hydra:
  run:
    dir: ${general.output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
