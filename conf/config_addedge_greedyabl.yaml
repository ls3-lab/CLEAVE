# GreedyAnchor ablation: standard + degree-free shortlist. add_edge.
defaults:
  - dataset: cora
  - retriever: epagcl
  - attacker@attackers.1: greedy_anchor
  - attacker@attackers.2: greedy_anchor_nodeg
  - attacker@attackers.3: greedy_anchor_v2
  - _self_
general:
  seed: 42
  device: cuda
  budget: 5
  graph_model: gcn
  add_edge: true
  output_dir: ${hydra:runtime.cwd}/output_addedge
  cache_dir: ${hydra:runtime.cwd}/cache
hydra:
  run:
    dir: ${general.output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
