# RobustTransfer only (fixed run-pin vote).
defaults:
  - dataset: cora
  - retriever: grace
  - attacker@attackers.1: robusttransfer
  - _self_
general:
  seed: 42
  device: cuda
  budget: 5
  graph_model: gcn
  add_edge: true
  output_dir: ${hydra:runtime.cwd}/output_addedge
  cache_dir: ${hydra:runtime.cwd}/cache
hydra:
  run:
    dir: ${general.output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
