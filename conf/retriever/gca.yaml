# GCA (Graph Contrastive Learning with Adaptive Augmentation) retriever configuration
name: gca
hidden_dim: 256
num_proj_hidden: 256
num_layers: 2
activation: prelu
tau: 0.4
learning_rate: 0.001
weight_decay: 1e-5
epochs: 200
drop_edge_rate_1: 0.2
drop_edge_rate_2: 0.3
drop_feature_rate_1: 0.1
drop_feature_rate_2: 0.1
base_model: GCNConv
drop_scheme: degree

attack_model_path:
  Cora:
    gcn: ${hydra:runtime.cwd}/cache/checkpoints/gca/Cora/pgrace_gcn_attack.pth
  CiteSeer:
