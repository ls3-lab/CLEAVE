# EPA-GCL (Edge Perturbation Augmented Graph Contrastive Learning) retriever configuration
name: epagcl
hidden_dim: 256
proj_dim: 256
num_layers: 2
activation: prelu
tau: 0.4
learning_rate: 0.001
weight_decay: 0.00001
epochs: 200
edge_drop_rate: 0.3
feature_drop_rate: 0.3
model: gcn

attack_model_path:
  Cora:
    gcn: ${hydra:runtime.cwd}/cache/checkpoints/epagcl/Cora/best_ac_gcn_attack.pth
  CiteSeer:
