# Published add-edge baselines (wave 3): DICE, SPAC, Nettack, PGD, PGA.
# Results append to the same results_add_<dataset>_<retriever>_<budget>.csv files as
# config_addedge / config_addedge_grad (resume logic composes them into one set).
defaults:
  - dataset: cora
  - retriever: grace
  - attacker@attackers.1: dice_add
  - attacker@attackers.2: spac_add
  - attacker@attackers.3: nettack_add
  - attacker@attackers.4: pgd_add
  - attacker@attackers.5: pga_add
  - _self_
general:
  seed: 42
  device: cuda
  budget: 5
  graph_model: gcn
  add_edge: true
  output_dir: ${hydra:runtime.cwd}/output_addedge
  cache_dir: ${hydra:runtime.cwd}/cache
hydra:
  run:
    dir: ${general.output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
