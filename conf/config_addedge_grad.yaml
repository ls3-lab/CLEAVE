# Add-edge sweep: gradient + model-inversion attackers (extends config_addedge's 6).
defaults:
  - dataset: cora
  - retriever: grace
  - attacker@attackers.1: agpoa_querydrift
  - attacker@attackers.2: agpoa_selfdrift
  - attacker@attackers.3: nag_r_querydrift
  - attacker@attackers.4: nag_r_selfdrift
  - attacker@attackers.5: graphmi
  - _self_
general:
  seed: 42
  device: cuda
  budget: 5
  graph_model: gcn
  add_edge: true
  output_dir: ${hydra:runtime.cwd}/output_addedge
  cache_dir: ${hydra:runtime.cwd}/cache
hydra:
  run:
    dir: ${general.output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
